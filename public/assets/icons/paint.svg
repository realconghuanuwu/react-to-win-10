<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="palette-rim" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#f5fbff" />
      <stop offset="45%" stop-color="#d4ebfb" />
      <stop offset="100%" stop-color="#87bde6" />
    </linearGradient>
    <linearGradient id="palette-face" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#dff0fc" />
      <stop offset="100%" stop-color="#a8d3f2" />
    </linearGradient>
    <radialGradient id="blob-red" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ff7e6b" />
      <stop offset="55%" stop-color="#e83d25" />
      <stop offset="100%" stop-color="#b32412" />
    </radialGradient>
    <radialGradient id="blob-green" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#9ee356" />
      <stop offset="55%" stop-color="#5bb822" />
      <stop offset="100%" stop-color="#36800f" />
    </radialGradient>
    <radialGradient id="blob-yellow" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffe566" />
      <stop offset="55%" stop-color="#f7ae18" />
      <stop offset="100%" stop-color="#c97d06" />
    </radialGradient>
    <linearGradient id="brush-bristle" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#f2d5a4" />
      <stop offset="55%" stop-color="#d6a564" />
      <stop offset="100%" stop-color="#a87439" />
    </linearGradient>
    <linearGradient id="brush-ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eef3f7" />
      <stop offset="50%" stop-color="#c3ced6" />
      <stop offset="100%" stop-color="#7c8a96" />
    </linearGradient>
    <linearGradient id="brush-handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7a03d" />
      <stop offset="55%" stop-color="#d97118" />
      <stop offset="100%" stop-color="#9e4507" />
    </linearGradient>
    <filter id="drop-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#08243d" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Palette body with thumb cutout and thumb hole -->
  <g filter="url(#drop-shadow)">
    <path
      d="M 21.5 11.8
         C 31.2 10.6, 39.2 16.4, 38.8 25.0
         C 38.4 33.4, 29.8 39.2, 20.8 38.4
         C 16.8 38.0, 15.8 35.4, 16.7 32.8
         C 17.5 30.6, 15.6 29.6, 13.6 31.4
         C 11.4 33.4, 7.6 33.0, 6.2 29.4
         C 4.4 24.4, 9.8 13.3, 21.5 11.8 Z
         M 18.8 25.5
         A 2.7 2.4 0 1 0 18.8 30.3
         A 2.7 2.4 0 1 0 18.8 25.5 Z"
      fill="url(#palette-rim)"
      fill-rule="evenodd"
      stroke="#6ba4d4"
      stroke-width="0.7"
    />
    <path
      d="M 21.6 12.9
         C 30.4 11.8, 37.8 17.1, 37.4 24.7
         C 37.0 32.2, 29.1 37.6, 20.9 36.8
         C 17.6 36.5, 17.0 34.4, 17.8 32.1
         C 18.6 29.7, 15.7 28.1, 13.1 30.3
         C 11.2 32.0, 8.2 31.5, 7.2 28.5
         C 5.8 24.2, 10.8 14.2, 21.6 12.9 Z
         M 18.8 25.2
         A 3.0 2.7 0 1 0 18.8 30.6
         A 3.0 2.7 0 1 0 18.8 25.2 Z"
      fill="url(#palette-face)"
      fill-rule="evenodd"
    />
  </g>

  <!-- Glossy paint blobs (Red, Green, Yellow) -->
  <g>
    <ellipse cx="11.6" cy="24.2" rx="2.7" ry="2.4" transform="rotate(-14 11.6 24.2)" fill="url(#blob-red)" />
    <ellipse cx="10.9" cy="23.3" rx="0.9" ry="0.55" transform="rotate(-20 10.9 23.3)" fill="#ffffff" fill-opacity="0.7" />

    <ellipse cx="16.2" cy="19.3" rx="2.8" ry="2.4" transform="rotate(-10 16.2 19.3)" fill="url(#blob-green)" />
    <ellipse cx="15.4" cy="18.4" rx="0.95" ry="0.55" transform="rotate(-18 15.4 18.4)" fill="#ffffff" fill-opacity="0.7" />

    <ellipse cx="22.8" cy="16.8" rx="2.8" ry="2.4" transform="rotate(-5 22.8 16.8)" fill="url(#blob-yellow)" />
    <ellipse cx="22.0" cy="15.9" rx="0.95" ry="0.55" transform="rotate(-12 22.0 15.9)" fill="#ffffff" fill-opacity="0.75" />
  </g>

  <!-- Tilted wooden paintbrush on right -->
  <g transform="translate(27.5 23.5) rotate(22)" filter="url(#drop-shadow)">
    <!-- Bristles -->
    <path
      d="M -2.7 -14.2 C -1.2 -15.3, 1.5 -15.2, 3.0 -13.9 L 2.1 -7.0 L -2.1 -7.0 Z"
      fill="url(#brush-bristle)"
      stroke="#8f602b"
      stroke-width="0.45"
    />
    <path d="M -0.9 -14.4 L -0.7 -8.0 M 0.9 -14.3 L 0.7 -8.0" stroke="#9e6d34" stroke-width="0.4" stroke-opacity="0.55" />
    <!-- Silver ferrule -->
    <rect x="-2.15" y="-7.2" width="4.3" height="4.8" rx="0.4" fill="url(#brush-ferrule)" stroke="#687682" stroke-width="0.4" />
    <line x1="-2.0" y1="-5.2" x2="2.0" y2="-5.2" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.5" />
    <!-- Wooden handle -->
    <path
      d="M -2.05 -2.4 L 2.05 -2.4 C 2.1 5.5, 1.45 14.8, 0.75 18.2 C 0.55 19.0, -0.55 19.0, -0.75 18.2 C -1.45 14.8, -2.1 5.5, -2.05 -2.4 Z"
      fill="url(#brush-handle)"
      stroke="#853a05"
      stroke-width="0.45"
    />
  </g>
</svg>
